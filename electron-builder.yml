appId: com.xiaozhi.desktop
productName: xiaozhi-desktop
directories:
  buildResources: build
  output: release
files:
  # 排除源代码和配置文件（electron-builder 会自动包含 out、resources、node_modules）
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!config/*'
  - '!*.md'
  - '!scripts/*'

# 额外资源：复制到 app.asar 外部的 Contents/Resources 目录
extraResources:
  # 唤醒词模型文件（必须在文件系统中，不能在 ASAR 内）
  - from: resources/wake-word-models
    to: wake-word-models

  # Live2D 默认模型文件（用于首次启动时复制到用户目录）
  - from: out/renderer/Resources
    to: live2d-models

asarUnpack:
  # ASAR 解包：解包资源文件
  # 注意：.node 文件会被 electron-builder 自动识别并排除在 asar 之外，无需显式配置
  - resources/**
  - node_modules/sherpa-onnx-*/**/*

win:
  executableName: xiaozhi-desktop
  icon: build/icon.ico
  # 排除其他平台的 sherpa-onnx 包（减小包体积）
  files:
    - '!node_modules/sherpa-onnx-darwin-*/**/*'
    - '!node_modules/sherpa-onnx-linux-*/**/*'
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # 排除其他平台的 sherpa-onnx 包（减小包体积）
  files:
    - '!node_modules/sherpa-onnx-win-*/**/*'
    - '!node_modules/sherpa-onnx-linux-*/**/*'
  # 只构建当前架构（避免 DMG 文件名冲突）
  # 如需构建其他架构：
  #   - arm64: pnpm run build && electron-builder --mac --arm64
  #   - x64:   pnpm run build && electron-builder --mac --x64
  #   - universal: pnpm run build && electron-builder --mac --universal
  target:
    - dmg
    - zip
  # 不签名配置：不需要 hardenedRuntime 和 entitlements
  # 设置 CSC_IDENTITY_AUTO_DISCOVERY=false 确保不自动签名
  extendInfo:
    LSUIElement: false
    NSCameraUsageDescription: 小智桌面需要访问您的摄像头以提供视觉识别功能。
    NSMicrophoneUsageDescription: 小智桌面需要访问您的麦克风以进行语音交互。
    NSDocumentsFolderUsageDescription: 小智桌面需要访问您的文档文件夹以保存和管理文件。
    NSDownloadsFolderUsageDescription: 小智桌面需要访问您的下载文件夹以保存下载的文件。
    NSDesktopFolderUsageDescription: 小智桌面需要访问您的桌面以保存文件。
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  # 只构建当前架构（避免文件名冲突）
  icon: build/icon.png
  # 排除其他平台的 sherpa-onnx 包（减小包体积）
  files:
    - '!node_modules/sherpa-onnx-darwin-*/**/*'
    - '!node_modules/sherpa-onnx-win-*/**/*'
  target:
    - AppImage
    - deb
  maintainer: xiaozhi.me
  category: Utility
  executableName: xiaozhi-desktop
  desktop:
    Name: 小智桌面
    Comment: 智能桌面助手
    Categories: Utility;
    Icon: xiaozhi-desktop
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
# 使用预编译的平台特定包（sherpa-onnx-darwin-*, sherpa-onnx-win-*），无需重新编译
npmRebuild: false
# 自动更新配置（如果需要）
# publish:
#   provider: generic
#   url: https://your-update-server.com/releases
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# 压缩选项（可选，减小包体积）
compression: normal # store | normal | maximum
