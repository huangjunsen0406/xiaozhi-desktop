appId: com.xiaozhi.desktop
productName: 小智
directories:
  buildResources: build
  output: release
# 排除规则必须全部集中在根 files：一旦同时给 win/mac/linux 定义 files:，
# electron-builder 会把根 files 的字符串列表 normalize 成独立的 FileSet matcher
# （从 appDir 再走一遍），与主 matcher 遍历结果取并集打包 → 两边各自漏排，
# v1.2.1 曾因此把 .git、src、scripts、.npmrc、release/（含 app 自身）整包打进 asar。
files:
  # 排除源代码和配置文件（electron-builder 会自动包含 out、resources、node_modules）
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,eslint.config.mts,.eslintrc-auto-import.json,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig.node.tsbuildinfo,tsconfig.web.tsbuildinfo}'
  - '!config/*'
  - '!*.md'
  - '!scripts/*'
  - '!examples{,/**/*}'
  - '!tools{,/**/*}'
  # 显式排除版本库元数据（默认排除策略是兜底，显式列出防止回归）
  - '!**/.git{,/**/*}'
  - '!**/.claude{,/**/*}'
  # 注意：不要把「排除其他平台原生模块包」写到这里或 win/mac/linux 的 files:。
  # 放到平台 files: 会让根 files 被 normalizeFiles 拆成独立 matcher（上文已述）；
  # 合并到根 files 则会误伤当前平台的包。正确做法：用 pnpm-workspace.yaml 的
  # supportedArchitectures 让安装端只装当前平台（CI 已如此，本机同样）。
  # 本仓库所有平台包均依赖安装源裁剪，无需在打包配置里二次排除。

# 额外资源：复制到 app.asar 外部的 Contents/Resources 目录
extraResources:
  # 唤醒词模型文件（必须在文件系统中，不能在 ASAR 内）
  - from: resources/wake-word-models
    to: wake-word-models

  # Live2D 默认模型（Hiyori 等，首次启动复制到 userData/models）
  - from: resources/live2d-models
    to: live2d-models

  # 内置精灵宠物（月薪喵/usagi/sensen，首次启动复制到 userData/pets）
  - from: resources/pets
    to: pets

asarUnpack:
  # ASAR 解包: 原生 .node 模块需要在文件系统中直接访问
  # 注意: resources/ 不需要 unpack，唤醒词模型已通过 extraResources 处理，图标可在 asar 内正常访问
  - node_modules/sherpa-onnx-*/**/*
  # sharp 官方要求从 asar 解包；pnpm 实际路径在 .pnpm/@img+* 下
  - '**/{sharp,@img}/**/*'
  - '**/*.node'
afterPack: scripts/afterPack.js

win:
  executableName: xiaozhi-desktop
  icon: build/icon.ico
  target:
    - target: nsis
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 卸载时清掉 Roaming 下的配置。mac/linux 仍需关于页「清除本地配置」或 --reset-data
  deleteAppDataOnUninstall: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - dmg
    - zip
  # 不走 Developer ID。不要 ad-hoc 重签主程序：1.1.7 的指定要求是
  # Electron 主二进制 cdhash，重签后应用内更新会报「未能满足指定的代码要求」。
  extendInfo:
    LSUIElement: false
    NSCameraUsageDescription: 小智桌面需要访问您的摄像头以提供视觉识别功能。
    NSMicrophoneUsageDescription: 小智桌面需要访问您的麦克风以进行语音交互。
    NSAudioCaptureUsageDescription: 小智桌面在启用「系统级回声消除」时需要获取系统音频参考，以减少扬声器与其它应用声音造成的回声。
    NSDocumentsFolderUsageDescription: 小智桌面需要访问您的文档文件夹以保存和管理文件。
    NSDownloadsFolderUsageDescription: 小智桌面需要访问您的下载文件夹以保存下载的文件。
    NSDesktopFolderUsageDescription: 小智桌面需要访问您的桌面以保存文件。
  notarize: false
  # zip 默认用 productName（「小智」），GitHub Release 会剥掉非 ASCII，
  # 上传成 -1.1.8-arm64-mac.zip，和 latest-mac.yml 对不上 → 应用内更新 404。
  # 与 dmg / nsis 一样用 package.json name。
  artifactName: ${name}-${version}-${arch}-mac.${ext}
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  maintainer: xiaozhi.me
  category: Utility
  executableName: xiaozhi-desktop
  desktop:
    Name: 小智桌面
    Comment: 智能桌面助手
    Categories: Utility;
    Icon: xiaozhi-desktop
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
# 使用预编译的平台特定包（sherpa-onnx-darwin-*, sherpa-onnx-win-*），无需重新编译
npmRebuild: false
# 应用内更新：产物与 latest*.yml 发到公仓 Release（与 .github/workflows/release.yml 一致）
# 本地 build:* 仍用 --publish=never，只生成 yml 不上传
publish:
  provider: github
  owner: huangjunsen0406
  repo: xiaozhi-desktop-release
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# 压缩选项（可选，减小包体积）
compression: normal # store | normal | maximum
