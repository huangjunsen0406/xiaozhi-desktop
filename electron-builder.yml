appId: com.xiaozhi.desktop
productName: 小智
directories:
  buildResources: build
  output: release
files:
  # 排除源代码和配置文件（electron-builder 会自动包含 out、resources、node_modules）
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!config/*'
  - '!*.md'
  - '!scripts/*'

# 额外资源：复制到 app.asar 外部的 Contents/Resources 目录
extraResources:
  # 唤醒词模型文件（必须在文件系统中，不能在 ASAR 内）
  - from: resources/wake-word-models
    to: wake-word-models

  # Live2D 默认模型（Hiyori 等，首次启动复制到 userData/models）
  - from: resources/live2d-models
    to: live2d-models

  # 内置精灵宠物（月薪喵/usagi/sensen，首次启动复制到 userData/pets）
  - from: resources/pets
    to: pets

asarUnpack:
  # ASAR 解包: 原生 .node 模块需要在文件系统中直接访问
  # 注意: resources/ 不需要 unpack，唤醒词模型已通过 extraResources 处理，图标可在 asar 内正常访问
  - node_modules/sherpa-onnx-*/**/*
  # sharp 官方要求从 asar 解包；pnpm 实际路径在 .pnpm/@img+* 下
  - '**/{sharp,@img}/**/*'
  - '**/*.node'
afterPack: scripts/afterPack.js

win:
  executableName: xiaozhi-desktop
  icon: build/icon.ico
  # 排除其他平台的原生模块包（减小包体积）
  files:
    - '!node_modules/sherpa-onnx-darwin-*/**/*'
    - '!node_modules/sherpa-onnx-linux-*/**/*'
    # 排除其他平台的 sharp 预编译包
    - '!node_modules/@img/sharp-darwin-*/**/*'
    - '!node_modules/@img/sharp-linux-*/**/*'
    - '!node_modules/@img/sharp-libvips-darwin-*/**/*'
    - '!node_modules/@img/sharp-libvips-linux-*/**/*'
  target:
    - target: nsis
nsis:
  artifactName: ${name}-${version}-${arch}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  # 排除其他平台的原生模块包（减小包体积）
  files:
    - '!node_modules/sherpa-onnx-win-*/**/*'
    - '!node_modules/sherpa-onnx-linux-*/**/*'
    # 排除其他平台的 sharp 预编译包
    - '!node_modules/@img/sharp-win32-*/**/*'
    - '!node_modules/@img/sharp-linux-*/**/*'
    - '!node_modules/@img/sharp-libvips-linux-*/**/*'
  target:
    - dmg
    - zip
  # 不走 Developer ID。Squirrel.Mac / ShipIt 仍要求 zip 里的 .app 有一份
  # 和资源一致的签名；完全不签会留下 Electron 原包的过期清单，报
  # 「代码不含资源，但签名指示这些资源必须存在」。
  # "-" = ad-hoc，CI 无证书也能签。
  identity: '-'
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    LSUIElement: false
    NSCameraUsageDescription: 小智桌面需要访问您的摄像头以提供视觉识别功能。
    NSMicrophoneUsageDescription: 小智桌面需要访问您的麦克风以进行语音交互。
    NSAudioCaptureUsageDescription: 小智桌面在启用「系统级回声消除」时需要获取系统音频参考，以减少扬声器与其它应用声音造成的回声。
    NSDocumentsFolderUsageDescription: 小智桌面需要访问您的文档文件夹以保存和管理文件。
    NSDownloadsFolderUsageDescription: 小智桌面需要访问您的下载文件夹以保存下载的文件。
    NSDesktopFolderUsageDescription: 小智桌面需要访问您的桌面以保存文件。
  notarize: false
  # zip 默认用 productName（「小智」），GitHub Release 会剥掉非 ASCII，
  # 上传成 -1.1.8-arm64-mac.zip，和 latest-mac.yml 对不上 → 应用内更新 404。
  # 与 dmg / nsis 一样用 package.json name。
  artifactName: ${name}-${version}-${arch}-mac.${ext}
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  # 排除其他平台的原生模块包（减小包体积）
  files:
    - '!node_modules/sherpa-onnx-darwin-*/**/*'
    - '!node_modules/sherpa-onnx-win-*/**/*'
    # 排除其他平台的 sharp 预编译包
    - '!node_modules/@img/sharp-darwin-*/**/*'
    - '!node_modules/@img/sharp-win32-*/**/*'
    - '!node_modules/@img/sharp-libvips-darwin-*/**/*'
  target:
    - AppImage
    - deb
  maintainer: xiaozhi.me
  category: Utility
  executableName: xiaozhi-desktop
  desktop:
    Name: 小智桌面
    Comment: 智能桌面助手
    Categories: Utility;
    Icon: xiaozhi-desktop
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}-${version}-${arch}.${ext}
# 使用预编译的平台特定包（sherpa-onnx-darwin-*, sherpa-onnx-win-*），无需重新编译
npmRebuild: false
# 应用内更新：产物与 latest*.yml 发到公仓 Release（与 .github/workflows/release.yml 一致）
# 本地 build:* 仍用 --publish=never，只生成 yml 不上传
publish:
  provider: github
  owner: huangjunsen0406
  repo: xiaozhi-desktop-release
  releaseType: release
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
# 压缩选项（可选，减小包体积）
compression: normal # store | normal | maximum
