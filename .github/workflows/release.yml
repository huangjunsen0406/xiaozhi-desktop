name: Build/release Electron app

on:
  push:
    tags:
      - v*.*.*

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # 让 node-gyp 使用 PATH 里的 python
      PYTHON: python

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # macOS 和 Windows 上给 node-gyp 准备 Python
      - name: Setup Python for node-gyp (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Python for node-gyp (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify sherpa-onnx native module
        run: pnpm run verify:sherpa

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win

      # 打包后检查：确认 .node 文件已正确放入 app.asar.unpacked
      - name: Verify packaged native modules (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          echo "=== Checking sherpa-onnx in win-unpacked ==="
          $basePath = "release\win-unpacked\resources\app.asar.unpacked\node_modules\sherpa-onnx-win-x64"
          if (Test-Path $basePath) {
            echo "✅ sherpa-onnx-win-x64 directory exists"
            Get-ChildItem $basePath -Recurse | Select-Object FullName
            $nodeFile = Join-Path $basePath "sherpa-onnx.node"
            if (Test-Path $nodeFile) {
              echo "✅ sherpa-onnx.node found!"
            } else {
              echo "❌ sherpa-onnx.node NOT found!"
              exit 1
            }
          } else {
            echo "❌ sherpa-onnx-win-x64 directory NOT found!"
            echo "Listing available directories:"
            Get-ChildItem "release\win-unpacked\resources" -Recurse -Directory | Select-Object FullName
            exit 1
          }

      - name: Verify packaged native modules (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          echo "=== Checking sherpa-onnx in mac-unpacked ==="
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            PKG="sherpa-onnx-darwin-arm64"
          else
            PKG="sherpa-onnx-darwin-x64"
          fi
          BASE_PATH="release/mac-arm64/xiaozhi-desktop.app/Contents/Resources/app.asar.unpacked/node_modules/$PKG"
          if [ ! -d "$BASE_PATH" ]; then
            BASE_PATH="release/mac/xiaozhi-desktop.app/Contents/Resources/app.asar.unpacked/node_modules/$PKG"
          fi
          if [ -d "$BASE_PATH" ]; then
            echo "✅ $PKG directory exists"
            ls -la "$BASE_PATH"
            if [ -f "$BASE_PATH/sherpa-onnx.node" ]; then
              echo "✅ sherpa-onnx.node found!"
            else
              echo "❌ sherpa-onnx.node NOT found!"
              exit 1
            fi
          else
            echo "❌ $PKG directory NOT found!"
            find release -name "app.asar.unpacked" -type d 2>/dev/null | head -5
            exit 1
          fi

      - name: Verify packaged native modules (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "=== Checking sherpa-onnx in linux-unpacked ==="
          BASE_PATH="release/linux-unpacked/resources/app.asar.unpacked/node_modules/sherpa-onnx-linux-x64"
          if [ -d "$BASE_PATH" ]; then
            echo "✅ sherpa-onnx-linux-x64 directory exists"
            ls -la "$BASE_PATH"
            if [ -f "$BASE_PATH/sherpa-onnx.node" ]; then
              echo "✅ sherpa-onnx.node found!"
            else
              echo "❌ sherpa-onnx.node NOT found!"
              exit 1
            fi
          else
            echo "❌ sherpa-onnx-linux-x64 directory NOT found!"
            find release -name "app.asar.unpacked" -type d 2>/dev/null | head -5
            exit 1
          fi

      - name: Upload artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          # 只让 Linux job 生成 release notes，避免三个平台重复写入
          generate_release_notes: ${{ matrix.os == 'ubuntu-latest' }}
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
