name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 私仓 Release（仅 release notes，不含安装包）
  create-private-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Create Private Repo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 三平台构建 + 上传公仓 Release
  build-and-release:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for node-gyp
        if: matrix.os != 'ubuntu-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Override supported architectures
        shell: bash
        run: |
          echo "supportedArchitectures.os=current" >> .npmrc
          echo "supportedArchitectures.cpu=current" >> .npmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux

      - name: Upload to Public Release Repository
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.yml
            release/*.blockmap
