name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 私仓 Release（仅 release notes，不含安装包）
  create-private-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Create Private Repo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 公仓 Release（先创建空 Release，后续 build job 上传文件）
  create-public-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create Public Repo Release
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}

  # 多平台多架构构建 + 上传安装包到公仓 Release
  build-and-upload:
    needs: create-public-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            build_cmd: --mac --arm64
          - os: macos-latest
            arch: x64
            build_cmd: --mac --x64
          - os: windows-latest
            arch: x64
            build_cmd: --win --x64
          - os: ubuntu-latest
            arch: x64
            build_cmd: --linux --x64
          - os: ubuntu-24.04-arm
            arch: arm64
            build_cmd: --linux --arm64 -c.linux.target=AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for node-gyp
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxinerama-dev libxkbcommon-x11-dev libxrandr-dev libxkbfile-dev

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Override supported architectures
        shell: bash
        run: |
          echo "supportedArchitectures.os=current" >> .npmrc
          echo "supportedArchitectures.cpu=${{ matrix.arch }}" >> .npmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}

      - name: Build
        run: pnpm run clean && pnpm run build && pnpm exec electron-builder ${{ matrix.build_cmd }} --publish=never

      - name: Upload assets to Public Release
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
