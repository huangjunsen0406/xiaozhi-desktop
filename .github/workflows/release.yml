name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 私仓：生成结构化 changelog（git log 按类型分组）+ 创建 Release（不含安装包）
# 公仓 xiaozhi-desktop-release：同步同一份说明 + 仅上传安装包/更新所需元数据
jobs:
  # ── 1. 私仓 Release（生成 changelog + 建 release，不含安装包）────────────────
  create-private-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_body: ${{ steps.changelog.outputs.body }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          # 生成 changelog 需要完整历史与 tags
          fetch-depth: 0

      # 按 Conventional Commits 前缀分组生成 changelog，替代 GitHub 自动生成的
      # 一行 "Full Changelog: <私仓 compare 链接>" HTML（248a08b 引入，曾流入 latest*.yml 的 releaseNotes）
      - name: Generate structured changelog
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          CUR_TAG="${{ github.ref_name }}"
          # tag 按语义版本倒序，第一个是当前 tag，第二个是上一个版本
          PREV_TAG="$(git tag --sort=-version:refname | sed -n 2p || true)"
          if [[ -n "$PREV_TAG" ]]; then
            RANGE="${PREV_TAG}..${CUR_TAG}"
            LOG="$(git log --pretty=format:'%s' "$RANGE" 2>/dev/null || true)"
            echo "changelog range: ${RANGE}"
          else
            # workflow_dispatch 无 tag：取最近 50 条提交
            LOG="$(git log --pretty=format:'%s' -50 2>/dev/null || true)"
            echo "changelog range: <last 50 commits>"
          fi
          # 去掉版本发布提交本身
          LOG="$(printf '%s\n' "$LOG" | grep -vE '^chore: release' || true)"

          FEATURES="$(printf '%s\n' "$LOG" | grep -E '^(feat|feature)' || true)"
          FIXES="$(printf '%s\n' "$LOG" | grep -E '^fix' || true)"
          OTHERS="$(printf '%s\n' "$LOG" | grep -vE '^(feat|feature|fix)' || true)"

          count() { printf '%s\n' "$1" | grep -c . || true; }
          BODY="本次发布包含 $(count "$FEATURES") 项新功能、$(count "$FIXES") 项修复、$(count "$OTHERS") 项其他改动。"

          if [[ -n "$FEATURES" ]]; then
            BODY+=$'\n\n## 新功能\n'"$FEATURES"
          fi
          if [[ -n "$FIXES" ]]; then
            BODY+=$'\n\n## 修复\n'"$FIXES"
          fi
          if [[ -n "$OTHERS" ]]; then
            BODY+=$'\n\n## 其他\n'"$OTHERS"
          fi

          {
            echo "body<<__CHANGELOG_EOF__"
            printf '%s\n' "$BODY"
            echo "__CHANGELOG_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "changelog length: ${#BODY}"

      - name: Create Private Repo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. 公仓 Release（同步私仓说明，先建空壳再由 build 传包）─
  create-public-release:
    needs: create-private-release
    runs-on: ubuntu-latest
    steps:
      - name: Create / update Public Repo Release with synced notes
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ needs.create-private-release.outputs.release_body }}
          make_latest: true

  # ── 3. 多平台构建 + 上传「下载包」到公仓 ──────────────────
  build-and-upload:
    needs: create-public-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # mac 两个架构拆成独立 job（build-mac-*）：latest-mac.yml 需合并，
          # 矩阵内并行上传同名文件会互相覆盖（曾导致 arm64 用户更新到 x64 包）
          - os: windows-latest
            arch: x64
            build_cmd: --win --x64
          - os: ubuntu-latest
            arch: x64
            build_cmd: --linux --x64
          - os: ubuntu-24.04-arm
            arch: arm64
            build_cmd: --linux --arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for node-gyp
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # arm runner 打 mac x64 时，部分 native 模块编译需要 x86_64 工具链（Rosetta）
      - name: Install Rosetta 2 (mac x64 on Apple Silicon)
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: |
          if /usr/bin/pgrep oahd >/dev/null 2>&1; then
            echo "Rosetta already available"
          else
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxinerama-dev libxkbcommon-x11-dev libxrandr-dev libxkbfile-dev ruby-dev

      - name: Install fpm for deb packaging
        if: runner.os == 'Linux'
        run: sudo gem install fpm

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Override supported architectures
        shell: bash
        run: |
          # 覆盖仓库默认：当前 OS + 【本机架构 + 目标架构】去重。
          # pnpm 10 只认 pnpm-workspace.yaml 里的 supportedArchitectures。
          # 必须同时装本机架构：build 阶段 rollup 等原生模块按 runner 架构运行
          # （如 arm64 runner 交叉出 mac x64 包时，rollup 需要 darwin-arm64）。
          node -e "
            const fs = require('fs')
            const host = process.arch
            const target = '${{ matrix.arch }}'
            const cpus = [...new Set([host, target])]
            const yaml = 'packages: []\n'
              + 'supportedArchitectures:\n'
              + '  os:\n'
              + '    - current\n'
              + '  cpu:\n'
              + cpus.map(c => '    - ' + c).join('\n') + '\n'
            fs.writeFileSync('pnpm-workspace.yaml', yaml)
          "
          echo "---- pnpm-workspace.yaml ----"
          cat pnpm-workspace.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      # postinstall 的 install-app-deps 按 runner 本机架构编译 better-sqlite3 /
      # uiohook-napi 等（arm64 runner 出 x64 包时会得到 arm64 模块 → dlopen 架构不匹配，
      # 曾导致 1.2.0 x64 包启动即挂）。显式按目标架构重编。
      - name: Rebuild native modules for target arch
        run: pnpm exec electron-builder install-app-deps --arch ${{ matrix.arch }}

      - name: Ensure sharp native for target arch
        run: node scripts/ensure-sharp-native.js ${{ matrix.arch }}

      - name: Build
        run: pnpm run clean && pnpm run build && pnpm exec electron-builder ${{ matrix.build_cmd }} --publish=never
        env:
          USE_SYSTEM_FPM: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          # 与 install 一致，避免 electron-builder / rebuild 回到 host arch
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}
          # 禁止在 runner 钥匙串里乱抓证书；mac 用 electron-builder identity: "-"
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # 只收集用户下载包 + 应用内更新必需文件；排除 builder-debug.yml 等调试产物
      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-upload
          shopt -s nullglob

          # 安装包
          for f in release/*.{exe,dmg,AppImage,deb,zip,pacman}; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done

          # 差量更新 blockmap（与安装包成对）
          for f in release/*.blockmap; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done

          # electron-updater feed（只要 latest*，不要 builder-debug.yml）
          for f in release/latest.yml release/latest-*.yml; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done

          # GitHub 会剥掉文件名里的非 ASCII。productName「小智」会变成
          # -1.1.8-arm64-mac.zip，和 latest-mac.yml 对不上。上传前改成 package name。
          pkg_name="$(node -p "require('./package.json').name")"
          for f in .release-upload/*; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            case "$base" in
              latest*|"${pkg_name}"*) continue ;;
            esac
            cleaned="${base#小智}"
            cleaned="${cleaned#-}"
            dest=".release-upload/${pkg_name}-${cleaned}"
            if [[ "$f" != "$dest" ]]; then
              mv -v "$f" "$dest"
            fi
          done

          count="$(find .release-upload -type f | wc -l | tr -d ' ')"
          echo "Collected $count asset(s) for upload"
          ls -la .release-upload || true
          if [[ "$count" -eq 0 ]]; then
            echo "No assets to upload for this matrix leg"
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to Public Release
        if: steps.assets.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          # 不传 body，避免多 matrix 并发把已同步的说明覆盖成空
          files: .release-upload/*
          fail_on_unmatched_files: false

  # ── 3a. mac 双架构独立 job（latest-mac.yml 需合并，矩阵内并行上传会互相覆盖）──
  build-mac-x64:
    needs: create-public-release
    runs-on: macos-latest
    env:
      npm_config_arch: x64
      npm_config_target_arch: x64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # arm64 runner 交叉出 x64 需要 x86_64 工具链
      - name: Install Rosetta 2
        run: |
          if /usr/bin/pgrep oahd >/dev/null 2>&1; then
            echo "Rosetta already available"
          else
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Override supported architectures (host + x64)
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            const cpus = [...new Set([process.arch, 'x64'])]
            const yaml = 'packages: []\n'
              + 'supportedArchitectures:\n'
              + '  os:\n'
              + '    - current\n'
              + '  cpu:\n'
              + cpus.map(c => '    - ' + c).join('\n') + '\n'
            fs.writeFileSync('pnpm-workspace.yaml', yaml)
          "
          cat pnpm-workspace.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64

      # 按目标架构重编原生模块（postinstall 的 install-app-deps 会按 runner 架构编译）
      - name: Rebuild native modules for x64
        run: pnpm exec electron-builder install-app-deps --arch x64

      - name: Ensure sharp native for x64
        run: node scripts/ensure-sharp-native.js x64

      - name: Build (mac x64)
        run: pnpm run clean && pnpm run build && pnpm exec electron-builder --mac --x64 --publish=never
        env:
          npm_config_arch: x64
          npm_config_target_arch: x64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Collect release assets (feed → latest-mac-x64.yml)
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-upload
          shopt -s nullglob
          for f in release/*.{dmg,zip}; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done
          for f in release/*.blockmap; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done
          # mac feed 改名：最终 latest-mac.yml 由 merge-mac-feed 合并生成
          if [[ -f release/latest-mac.yml ]]; then
            cp -v release/latest-mac.yml .release-upload/latest-mac-x64.yml
          fi
          pkg_name="$(node -p "require('./package.json').name")"
          for f in .release-upload/*; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            case "$base" in
              latest*|"${pkg_name}"*) continue ;;
            esac
            cleaned="${base#小智}"; cleaned="${cleaned#-}"
            dest=".release-upload/${pkg_name}-${cleaned}"
            [[ "$f" != "$dest" ]] && mv -v "$f" "$dest"
          done
          count="$(find .release-upload -type f | wc -l | tr -d ' ')"
          echo "Collected $count asset(s)"
          ls -la .release-upload || true
          if [[ "$count" -eq 0 ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to Public Release
        if: steps.assets.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: .release-upload/*
          fail_on_unmatched_files: false

  build-mac-arm64:
    needs: create-public-release
    runs-on: macos-latest
    env:
      npm_config_arch: arm64
      npm_config_target_arch: arm64
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Override supported architectures (host + arm64)
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            const cpus = [...new Set([process.arch, 'arm64'])]
            const yaml = 'packages: []\n'
              + 'supportedArchitectures:\n'
              + '  os:\n'
              + '    - current\n'
              + '  cpu:\n'
              + cpus.map(c => '    - ' + c).join('\n') + '\n'
            fs.writeFileSync('pnpm-workspace.yaml', yaml)
          "
          cat pnpm-workspace.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64

      - name: Rebuild native modules for arm64
        run: pnpm exec electron-builder install-app-deps --arch arm64

      - name: Ensure sharp native for arm64
        run: node scripts/ensure-sharp-native.js arm64

      - name: Build (mac arm64)
        run: pnpm run clean && pnpm run build && pnpm exec electron-builder --mac --arm64 --publish=never
        env:
          npm_config_arch: arm64
          npm_config_target_arch: arm64
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Collect release assets (feed → latest-mac-arm64.yml)
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-upload
          shopt -s nullglob
          for f in release/*.{dmg,zip}; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done
          for f in release/*.blockmap; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done
          if [[ -f release/latest-mac.yml ]]; then
            cp -v release/latest-mac.yml .release-upload/latest-mac-arm64.yml
          fi
          pkg_name="$(node -p "require('./package.json').name")"
          for f in .release-upload/*; do
            [[ -f "$f" ]] || continue
            base="$(basename "$f")"
            case "$base" in
              latest*|"${pkg_name}"*) continue ;;
            esac
            cleaned="${base#小智}"; cleaned="${cleaned#-}"
            dest=".release-upload/${pkg_name}-${cleaned}"
            [[ "$f" != "$dest" ]] && mv -v "$f" "$dest"
          done
          count="$(find .release-upload -type f | wc -l | tr -d ' ')"
          echo "Collected $count asset(s)"
          ls -la .release-upload || true
          if [[ "$count" -eq 0 ]]; then
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to Public Release
        if: steps.assets.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          files: .release-upload/*
          fail_on_unmatched_files: false

  # ── 3b. 合并 mac 更新 feed：两个架构的 zip 都在 latest-mac.yml 里 ──
  merge-mac-feed:
    needs: [build-mac-x64, build-mac-arm64]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PUBLIC_REPO_PAT }}
    steps:
      - name: Download per-arch mac feeds
        run: |
          gh release download "${{ github.ref_name }}" \
            --repo huangjunsen0406/xiaozhi-desktop-release \
            --pattern 'latest-mac-*.yml' --clobber
          ls -la latest-mac-*.yml

      - name: Merge feeds into latest-mac.yml
        shell: bash
        run: |
          node -e "
            const fs = require('fs')
            function parse(text) {
              const out = { files: [] }
              let cur = null
              for (const line of text.split('\n')) {
                if (line.startsWith('version:')) out.version = line.slice(8).trim()
                else if (line.startsWith('path:')) { out.path = line.slice(5).trim(); cur = null }
                else if (line.startsWith('sha512:') && !cur) out.sha512 = line.slice(7).trim()
                else if (line.startsWith('releaseDate:')) out.releaseDate = line.slice(12).trim()
                else if (/^\s*- url:/.test(line)) { cur = { url: line.replace(/^\s*- url:\s*/, '') }; out.files.push(cur) }
                else if (/^\s*sha512:/.test(line) && cur) cur.sha512 = line.trim().slice(7).trim()
                else if (/^\s*size:/.test(line) && cur) cur.size = line.trim().slice(5).trim()
              }
              return out
            }
            const x64 = parse(fs.readFileSync('latest-mac-x64.yml', 'utf8'))
            const arm64 = parse(fs.readFileSync('latest-mac-arm64.yml', 'utf8'))
            const seen = new Set()
            const files = [...x64.files, ...arm64.files].filter(f => {
              if (seen.has(f.url)) return false
              seen.add(f.url)
              return true
            })
            const merged = {
              version: arm64.version || x64.version,
              files,
              path: arm64.path || x64.path,
              sha512: arm64.sha512 || x64.sha512,
              releaseDate: arm64.releaseDate || x64.releaseDate,
            }
            let out = 'version: ' + merged.version + '\nfiles:\n'
            for (const f of merged.files)
              out += '  - url: ' + f.url + '\n    sha512: ' + f.sha512 + '\n    size: ' + f.size + '\n'
            out += 'path: ' + merged.path + '\nsha512: ' + merged.sha512 + '\nreleaseDate: ' + merged.releaseDate + '\n'
            fs.writeFileSync('latest-mac.yml', out)
            console.log(out)
          "

      - name: Upload merged latest-mac.yml
        run: |
          gh release upload "${{ github.ref_name }}" \
            --repo huangjunsen0406/xiaozhi-desktop-release \
            latest-mac.yml --clobber
