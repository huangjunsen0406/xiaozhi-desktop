name: Build/release Electron app

on:
  push:
    tags:
      - v*.*.*

jobs:
  # 1) 三平台构建并上传构建产物（作为 workflow artifact）
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      # 让 node-gyp 使用 PATH 里的 python
      PYTHON: python

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # macOS 和 Windows 上给 node-gyp 准备 Python
      - name: Setup Python for node-gyp (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Python for node-gyp (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run build:linux

      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        run: pnpm run build:mac

      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win

      # 把 release 目录整体上传成 artifact，后面统一打到 GitHub Release 里
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-desktop-${{ matrix.os }}
          path: release
          # 如果当前平台没生成 release 目录就直接报错，方便排查
          if-no-files-found: error

  # 2) 单独 job：下载所有平台的 artifact，一次性创建 GitHub Release
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          # 把多个 artifact 的内容合并到当前工作目录（会保持 release/ 这个路径）
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # 只调用一次，notes 只生成一份
          generate_release_notes: true
          files: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.yml
            release/*.blockmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
