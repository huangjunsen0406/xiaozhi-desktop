name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 私仓：自动生成 Release Notes（.github/release.yml）
# 公仓 xiaozhi-desktop-release：同步同一份说明 + 仅上传安装包/更新所需元数据
jobs:
  # ── 1. 私仓 Release（仅 notes，不含安装包）────────────────
  create-private-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Create Private Repo Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # softprops 不输出 body，创建后再读回，供公仓同步
      - name: Export release notes body
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY="$(gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.body // empty')"
          {
            echo "body<<__RELEASE_NOTES_EOF__"
            printf '%s\n' "$BODY"
            echo "__RELEASE_NOTES_EOF__"
          } >> "$GITHUB_OUTPUT"
          echo "Private release notes length: ${#BODY}"

  # ── 2. 公仓 Release（同步私仓说明，先建空壳再由 build 传包）─
  create-public-release:
    needs: create-private-release
    runs-on: ubuntu-latest
    steps:
      - name: Create / update Public Repo Release with synced notes
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ needs.create-private-release.outputs.release_body }}
          make_latest: true

  # ── 3. 多平台构建 + 上传「下载包」到公仓 ──────────────────
  build-and-upload:
    needs: create-public-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon 包（runner 本身多为 arm64）
          - os: macos-latest
            arch: arm64
            build_cmd: --mac --arm64
          # Intel Mac 包：在 arm runner 上交叉出 x64（不再依赖退役风险高的 macos-13）
          # 需要 Rosetta + npm_config_arch=x64 拉取/编译 darwin-x64 原生模块
          - os: macos-latest
            arch: x64
            build_cmd: --mac --x64
          - os: windows-latest
            arch: x64
            build_cmd: --win --x64
          - os: ubuntu-latest
            arch: x64
            build_cmd: --linux --x64
          - os: ubuntu-24.04-arm
            arch: arm64
            build_cmd: --linux --arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python for node-gyp
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # arm runner 打 mac x64 时，部分 native 模块编译需要 x86_64 工具链（Rosetta）
      - name: Install Rosetta 2 (mac x64 on Apple Silicon)
        if: runner.os == 'macOS' && matrix.arch == 'x64'
        run: |
          if /usr/bin/pgrep oahd >/dev/null 2>&1; then
            echo "Rosetta already available"
          else
            softwareupdate --install-rosetta --agree-to-license
          fi

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxinerama-dev libxkbcommon-x11-dev libxrandr-dev libxkbfile-dev ruby-dev

      - name: Install fpm for deb packaging
        if: runner.os == 'Linux'
        run: sudo gem install fpm

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Override supported architectures
        shell: bash
        run: |
          # mac：x64 + arm64 都装。Apple Silicon 包被 Rosetta 打开时 process.arch=x64，
          # 只打单 arch 会报 Could not load sharp using the darwin-x64 runtime。
          # 其它平台只装当前 matrix arch，避免把无关原生包打进去。
          tmp="$(mktemp)"
          grep -v '^supportedArchitectures' .npmrc > "$tmp" || true
          mv "$tmp" .npmrc
          echo "supportedArchitectures.os[]=current" >> .npmrc
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            echo "supportedArchitectures.cpu[]=x64" >> .npmrc
            echo "supportedArchitectures.cpu[]=arm64" >> .npmrc
          else
            echo "supportedArchitectures.cpu[]=${{ matrix.arch }}" >> .npmrc
          fi
          echo "---- .npmrc ----"
          cat .npmrc

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      - name: Build
        run: pnpm run clean && pnpm run build && pnpm exec electron-builder ${{ matrix.build_cmd }} --publish=never
        env:
          USE_SYSTEM_FPM: ${{ runner.os == 'Linux' && 'true' || 'false' }}
          # 与 install 一致，避免 electron-builder / rebuild 回到 host arch
          npm_config_arch: ${{ matrix.arch }}
          npm_config_target_arch: ${{ matrix.arch }}

      # 只收集用户下载包 + 应用内更新必需文件；排除 builder-debug.yml 等调试产物
      - name: Collect release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-upload
          shopt -s nullglob

          # 安装包
          for f in release/*.{exe,dmg,AppImage,deb,zip,pacman}; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done

          # 差量更新 blockmap（与安装包成对）
          for f in release/*.blockmap; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done

          # electron-updater feed（只要 latest*，不要 builder-debug.yml）
          for f in release/latest.yml release/latest-*.yml; do
            [[ -f "$f" ]] || continue
            cp -v "$f" .release-upload/
          done

          count="$(find .release-upload -type f | wc -l | tr -d ' ')"
          echo "Collected $count asset(s) for upload"
          ls -la .release-upload || true
          if [[ "$count" -eq 0 ]]; then
            echo "No assets to upload for this matrix leg"
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to Public Release
        if: steps.assets.outputs.has_files == 'true'
        uses: softprops/action-gh-release@v2
        with:
          repository: huangjunsen0406/xiaozhi-desktop-release
          token: ${{ secrets.PUBLIC_REPO_PAT }}
          tag_name: ${{ github.ref_name }}
          # 不传 body，避免多 matrix 并发把已同步的说明覆盖成空
          files: .release-upload/*
          fail_on_unmatched_files: false
